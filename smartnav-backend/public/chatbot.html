<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartNav AI Travel Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
      background: #0b1220;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .chat-shell {
      width: min(900px, 96vw);
      height: min(720px, 94vh);
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #334155;
      background: linear-gradient(90deg, #172554, #1e293b);
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #c7d2fe;
    }
    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .chat-window {
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #334155;
      color: #f8fafc;
    }
    .bot {
      align-self: flex-start;
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
    }
    .input-row {
      border-top: 1px solid #334155;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      padding: 12px;
      outline: none;
    }
    input:focus {
      border-color: #60a5fa;
    }
    button {
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      padding: 0 18px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .meta {
      padding: 0 12px 12px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <section class="chat-shell">
    <header class="header">
      <h1>SmartNav AI Travel Assistant</h1>
      <p>Ask about routes, nearby attractions, budget travel, and recommendations.</p>
    </header>

    <main id="chatWindow" class="chat-window"></main>

    <footer>
      <div class="input-row">
        <input id="messageInput" type="text" placeholder="How to reach Ajanta Caves?" />
        <button id="sendBtn">Send</button>
      </div>
      <div class="meta">
        <span id="locationStatus">Location: requesting...</span>
        <span>API: POST /api/chat</span>
      </div>
    </footer>
  </section>

  <script>
    const chatWindow = document.getElementById("chatWindow");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const locationStatus = document.getElementById("locationStatus");

    let userLocation = { latitude: null, longitude: null };

    const addMessage = (text, role) => {
      const el = document.createElement("div");
      el.className = `message ${role}`;
      el.textContent = text;
      chatWindow.appendChild(el);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    };

    const formatStructuredResponse = (data) => {
      const lines = [data.reply || "No reply generated."];
      if (data.distance) lines.push(`Distance: ${data.distance}`);
      if (data.duration) lines.push(`Duration: ${data.duration}`);
      if (data.estimatedCost) lines.push(`Estimated Cost: ${data.estimatedCost}`);
      if (Array.isArray(data.nearbyPlaces) && data.nearbyPlaces.length) {
        lines.push("Nearby Places:");
        data.nearbyPlaces.forEach((p) => lines.push(`- ${p.name}: ${p.description}`));
      }
      return lines.join("\n");
    };

    const sendMessage = async () => {
      const message = messageInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      messageInput.value = "";
      sendBtn.disabled = true;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            latitude: userLocation.latitude,
            longitude: userLocation.longitude
          })
        });

        const data = await response.json();
        addMessage(formatStructuredResponse(data), "bot");
      } catch (error) {
        addMessage("Unable to reach chat service right now. Please try again.", "bot");
      } finally {
        sendBtn.disabled = false;
      }
    };

    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation.latitude = pos.coords.latitude;
          userLocation.longitude = pos.coords.longitude;
          locationStatus.textContent = `Location: ${userLocation.latitude.toFixed(4)}, ${userLocation.longitude.toFixed(4)}`;
        },
        () => {
          locationStatus.textContent = "Location: unavailable (grant permission for route/nearby features)";
        }
      );
    } else {
      locationStatus.textContent = "Location: unsupported by browser";
    }

    addMessage(
      "Hi! I am your AI travel assistant. Ask: How to reach Ajanta Caves? Show nearby tourist places. What is the cheapest way to travel?",
      "bot"
    );
  </script>
</body>
</html>
